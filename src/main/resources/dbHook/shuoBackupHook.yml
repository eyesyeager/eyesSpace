executor:
  name: shuoBackupHook
  cron: 0 0 9 ? * WED

monitor:
  judgeSql: "select * from (
      select 'shuoshuo' as category, url, create_time from shuoshuo_pic where create_time > ? order by create_time limit 50
  ) as t"
  resultType: entity
  resultClass: com.eyes.eyesspace.model.bo.FieldFileHookBO
  state:
    enabled: true
    fieldName: create_time
    fieldType: datetime
    defaultValue: 2000-01-01 00:00:00

handler:
  beanName: fieldFileDbHook
  params:
    appName: eyesspace