executor:
  name: videoBackupHook
  cron: 0 0/1 * * * ?

monitor:
  judgeSql: "
    select * from (
      select 'video' as category, video_url as url, create_time from video 
      UNION 
      select 'videoCover' as category, cover_url as url, create_time from video
    ) as t where create_time > ? order by create_time limit 10"
  resultType: entity
  resultClass: com.eyes.eyesspace.dbHook.entity.FieldFileHookEntity
  state:
    enabled: true
    fieldName: create_time
    fieldType: datetime
    defaultValue: 2000-01-01 00:00:00

handler:
  beanName: fieldFileDbHook
  params:
    appName: eyesspace