executor:
  name: friendBackupHook
  cron: 0 0 7 ? * WED

monitor:
  judgeSql: "select * from (
      select 'friend' as category, avatar as url, create_time from friend where create_time > ? order by create_time limit 1
  ) as t"
  resultType: entity
  resultClass: com.eyes.eyesspace.model.bo.FieldFileHookBO
  state:
    enabled: true
    fieldName: create_time
    fieldType: datetime
    defaultValue: 2000-01-01 00:00:00

handler:
  beanName: fieldFileDbHook
  params:
    appName: eyesspace