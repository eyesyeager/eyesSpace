executor:
  name: jokeBackupHook
  cron: 0 0 12 ? * WED

monitor:
  judgeSql: "select * from 
  (
      select 'joke' as category, url_list as url, create_time from joke where create_time > ? order by create_time limit 10
  ) as t"
  resultType: entity
  resultClass: com.eyes.eyesspace.model.bo.FieldFileHookBO
  state:
    enabled: true
    fieldName: create_time
    fieldType: datetime
    defaultValue: 2000-01-01 00:00:00

handler:
  beanName: fieldFileDbHook
  params:
    appName: eyesspace
    kind: jsonUrl